version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: giftsdb
    volumes:
      - mongodb_data:/data/db
    networks:
      - giftlink-network

  giftapp:
    build: ./giftlink-backend
    container_name: giftapp
    ports:
      - "3060:3060"
    environment:
      MONGO_URL: mongodb://mongodb:27017
      JWT_SECRET: your-secret-key
    depends_on:
      - mongodb
    networks:
      - giftlink-network

  frontend:
    build: ./giftlink-frontend
    container_name: giftlink-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3060
    depends_on:
      - giftapp
    networks:
      - giftlink-network

volumes:
  mongodb_data:

networks:
  giftlink-network:
    driver: bridge
